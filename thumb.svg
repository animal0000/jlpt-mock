  </text>

  <!-- Bottom Badges -->
  <g transform="translate(60, 360)">
    <rect width="90" height="30" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1.5" />
    <text x="45" y="20" fill="#e2e8f0" font-family="'Pretendard', sans-serif" font-size="13" font-weight="600" text-anchor="middle">해커스 N3</text>
  </g>
  <g transform="translate(160, 360)">
    <rect width="90" height="30" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1.5" />
    <text x="45" y="20" fill="#e2e8f0" font-family="'Pretendard', sans-serif" font-size="13" font-weight="600" text-anchor="middle">시사 N3</text>
  </g>
  <g transform="translate(260, 360)">
    <rect width="110" height="30" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1.5" />
    <text x="55" y="20" fill="#e2e8f0" font-family="'Pretendard', sans-serif" font-size="13" font-weight="600" text-anchor="middle">다락원 N3 1·2회</text>
  </g>
  <g transform="translate(380, 360)">
    <rect width="110" height="30" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1.5" />
    <text x="55" y="20" fill="#e2e8f0" font-family="'Pretendard', sans-serif" font-size="13" font-weight="600" text-anchor="middle">파고다 N2 3·4회</text>
