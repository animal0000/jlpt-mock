<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="blueG" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
    <linearGradient id="badgeG" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
  </defs>
  <rect width="800" height="450" fill="url(#bg)" />
  <circle cx="700" cy="80" r="140" fill="#3b82f6" opacity="0.08" />
  <circle cx="100" cy="380" r="160" fill="#f59e0b" opacity="0.05" />
  
  <!-- Badges -->
  <g transform="translate(60, 60)">
    <rect width="130" height="36" rx="8" fill="url(#blueG)" />
    <text x="65" y="24" fill="#ffffff" font-family="'Pretendard', sans-serif" font-size="16" font-weight="800" text-anchor="middle">JLPT MOCK</text>
  </g>
  <g transform="translate(200, 60)">
    <rect width="150" height="36" rx="8" fill="url(#badgeG)" />
    <text x="75" y="24" fill="#ffffff" font-family="'Pretendard', sans-serif" font-size="16" font-weight="800" text-anchor="middle">N3 · N2 622제</text>
  </g>

  <!-- Title -->
  <text x="60" y="160" fill="#ffffff" font-family="'Pretendard', sans-serif" font-size="38" font-weight="900" letter-spacing="-0.5">
